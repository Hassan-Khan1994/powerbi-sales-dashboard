<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sales Dashboard</title>
<style>
  :root{
    color-scheme: light;
    --page:#f9f9f7; --surface:#ffffff; --surface-2:#fcfcfb;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
    --good:#0ca30c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
  .wrap{max-width:1180px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .title h1{margin:0;font-size:22px;letter-spacing:-0.02em}
  .title p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:6px 12px;font-size:12px;color:var(--ink-2)}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .kpi .label{font-size:12px;color:var(--muted);margin-bottom:6px}
  .kpi .val{font-size:24px;font-weight:650;letter-spacing:-0.02em}
  .kpi .sub{font-size:12px;color:var(--good);margin-top:4px}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .card h3{margin:0 0 10px;font-size:14px;letter-spacing:-0.01em}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  svg{display:block;width:100%;height:auto;overflow:visible}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .axis-lbl{fill:var(--muted);font-size:11px}
  .val-lbl{fill:var(--ink-2);font-size:11px;font-variant-numeric:tabular-nums}
  .bar{transition:opacity .15s}
  .bar:hover{opacity:.78}
  .foot{color:var(--muted);font-size:11px;margin-top:14px;text-align:center}
  @media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">
      <h1>📊 Sales Performance Dashboard</h1>
      <p>NorthStar Distributors · FY2023–2024 · 600 orders</p>
    </div>
    <div class="chips">
      <div class="chip">Region: All</div>
      <div class="chip">Category: All</div>
      <div class="chip">Year: 2023–2024</div>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card">
      <h3>Sales Trend by Month</h3>
      <svg id="lineChart" viewBox="0 0 720 260"></svg>
    </div>
    <div class="card">
      <h3>Sales by Category</h3>
      <svg id="donut" viewBox="0 0 300 260"></svg>
      <div class="legend" id="catLegend"></div>
    </div>
  </div>

  <div class="grid3">
    <div class="card">
      <h3>Sales by Region</h3>
      <svg id="regionChart" viewBox="0 0 340 240"></svg>
    </div>
    <div class="card">
      <h3>Sales by Segment</h3>
      <svg id="segmentChart" viewBox="0 0 340 240"></svg>
    </div>
    <div class="card">
      <h3>Top Products</h3>
      <svg id="productChart" viewBox="0 0 340 240"></svg>
    </div>
  </div>

  <div class="foot">Built with sample data · Recreate live in Power BI from <code>data/sample_sales_data.csv</code></div>
</div>

<script>
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const fmtK = n => '$' + (n/1000).toFixed(0) + 'K';
const fmtM = n => '$' + (n/1e6).toFixed(2) + 'M';
const SER = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4'];

// KPIs
const kpis = [
  ['Total Sales', fmtM(2070845), '▲ vs target'],
  ['Total Profit', fmtK(505144), '24.4% margin'],
  ['Profit Margin', '24.4%', 'healthy'],
  ['Total Orders', '600', 'FY23–24'],
  ['Avg Order Value', fmt(3451), 'per order'],
];
document.getElementById('kpis').innerHTML = kpis.map(k=>
  `<div class="kpi"><div class="label">${k[0]}</div><div class="val">${k[1]}</div><div class="sub">${k[2]}</div></div>`).join('');

// Line chart — monthly sales
const months = [
  ['2023-01',122936],['2023-02',92333],['2023-03',96450],['2023-04',76454],['2023-05',65730],['2023-06',104062],
  ['2023-07',93663],['2023-08',66351],['2023-09',82700],['2023-10',96768],['2023-11',54462],['2023-12',86631],
  ['2024-01',91699],['2024-02',128785],['2024-03',104306],['2024-04',89821],['2024-05',62655],['2024-06',71699],
  ['2024-07',53855],['2024-08',97250],['2024-09',83771],['2024-10',62101],['2024-11',84553],['2024-12',101811]];
(function(){
  const W=720,H=260,pl=48,pr=12,pt=14,pb=30;
  const iw=W-pl-pr, ih=H-pt-pb;
  const max=Math.max(...months.map(m=>m[1]))*1.1;
  const x=i=>pl+iw*i/(months.length-1);
  const y=v=>pt+ih*(1-v/max);
  let g='';
  for(let t=0;t<=4;t++){const v=max*t/4;const yy=y(v);
    g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    g+=`<text x="${pl-6}" y="${yy+4}" text-anchor="end" class="axis-lbl">${fmtK(v)}</text>`;}
  const pts=months.map((m,i)=>`${x(i)},${y(m[1])}`).join(' ');
  const area=`${pl},${y(0)} `+pts+` ${x(months.length-1)},${y(0)}`;
  g+=`<polygon points="${area}" fill="var(--s1)" opacity="0.08"/>`;
  g+=`<polyline points="${pts}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
  months.forEach((m,i)=>{g+=`<circle cx="${x(i)}" cy="${y(m[1])}" r="3" fill="var(--s1)"><title>${m[0]}: ${fmt(m[1])}</title></circle>`;});
  months.forEach((m,i)=>{if(i%3===0)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="axis-lbl">${m[0].slice(2)}</text>`;});
  document.getElementById('lineChart').innerHTML=g;
})();

// Horizontal bar helper
function hbars(id,data,colorFn){
  const W=340,rh=Math.min(34,(240-10)/data.length),gap=8,pl=96,pr=54,pt=6;
  const H=pt+data.length*(rh)+ (data.length-1)*0; const iw=W-pl-pr;
  const max=Math.max(...data.map(d=>d[1]));
  let g='';
  data.forEach((d,i)=>{
    const yy=pt+i*(rh);const bw=iw*d[1]/max; const bh=rh-8;
    g+=`<text x="${pl-8}" y="${yy+bh/2+4}" text-anchor="end" class="axis-lbl">${d[0]}</text>`;
    g+=`<rect class="bar" x="${pl}" y="${yy}" width="${Math.max(bw,2)}" height="${bh}" rx="4" fill="${colorFn(i)}"><title>${d[0]}: ${fmt(d[1])}</title></rect>`;
    g+=`<text x="${pl+bw+6}" y="${yy+bh/2+4}" class="val-lbl">${fmtK(d[1])}</text>`;
  });
  const svg=document.getElementById(id); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=g;
}
hbars('regionChart',[['East',452959],['South',440339],['Central',420749],['West',380397],['North',376401]],()=>SER[0]);
hbars('segmentChart',[['Consumer',711062],['Corporate',698762],['SME',661021]],i=>SER[i%SER.length]);
hbars('productChart',[['Blender',153313],['Monitor',142082],['Printer Paper',128398],['Laptop',128098],['Cabinet',123539],['Notebook',121887]],()=>SER[2]);

// Donut — category
(function(){
  const data=[['Electronics',563773],['Appliances',541042],['Office Supplies',492528],['Furniture',473502]];
  const total=data.reduce((s,d)=>s+d[1],0);
  const cx=150,cy=130,r=92,rin=56; let a=-Math.PI/2,g='';
  data.forEach((d,i)=>{
    const ang=d[1]/total*Math.PI*2, a2=a+ang;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const xi1=cx+rin*Math.cos(a2),yi1=cy+rin*Math.sin(a2),xi2=cx+rin*Math.cos(a),yi2=cy+rin*Math.sin(a);
    const large=ang>Math.PI?1:0;
    g+=`<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${xi1},${yi1} A${rin},${rin} 0 ${large} 0 ${xi2},${yi2} Z" fill="${SER[i]}" stroke="var(--surface)" stroke-width="2"><title>${d[0]}: ${fmt(d[1])} (${(d[1]/total*100).toFixed(0)}%)</title></path>`;
    a=a2;
  });
  g+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" style="fill:var(--ink);font-size:20px;font-weight:650">${fmtM(total)}</text>`;
  g+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" class="axis-lbl">Total Sales</text>`;
  document.getElementById('donut').innerHTML=g;
  document.getElementById('catLegend').innerHTML=data.map((d,i)=>`<span><i class="dot" style="background:${SER[i]}"></i>${d[0]}</span>`).join('');
})();
</script>
</body>
</html>
